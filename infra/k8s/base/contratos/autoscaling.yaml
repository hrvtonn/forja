apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: contratos
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: contratos
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: contratos
spec:
  minAvailable: 1 # manutenção de nós nunca derruba todas as réplicas
  selector:
    matchLabels:
      app.kubernetes.io/name: contratos
