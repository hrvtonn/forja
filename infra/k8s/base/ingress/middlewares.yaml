# Middlewares do Traefik (ingress controller provisionado pelo Terraform)
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-contratos
spec:
  stripPrefix:
    prefixes: ["/contratos"]
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-flash-sales
spec:
  stripPrefix:
    prefixes: ["/flash-sales"]
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit-api
spec:
  rateLimit:
    average: 50
    burst: 200
---
# Exportação é cara: no máximo ~6 requisições por minuto por IP
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit-export
spec:
  rateLimit:
    average: 1
    period: 10s
    burst: 2
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
spec:
  headers:
    contentTypeNosniff: true
    frameDeny: true
    referrerPolicy: no-referrer
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: body-limit
spec:
  buffering:
    maxRequestBodyBytes: 1048576 # 1 MiB
