# Apenas as rotas de negócio e de health são publicadas.
# /metrics e /ready ficam acessíveis somente dentro do cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: contratos
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: "devops-api-strip-contratos@kubernetescrd,devops-api-rate-limit-api@kubernetescrd,devops-api-body-limit@kubernetescrd,devops-api-security-headers@kubernetescrd"
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /contratos/contracts
            pathType: Exact
            backend:
              service:
                name: contratos
                port:
                  name: http
          - path: /contratos/health
            pathType: Exact
            backend:
              service:
                name: contratos
                port:
                  name: http
---
