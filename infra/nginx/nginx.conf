# Gateway de borda do ambiente Docker Compose.
# Único ponto de entrada público: roteia por prefixo, aplica rate limiting,
# cabeçalhos de segurança e bloqueia o endpoint interno /metrics.

worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  server_tokens off;
  client_max_body_size 1m;

  # Diretórios temporários graváveis pelo usuário não-root
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  # Logs estruturados (JSON) para facilitar a agregação
  log_format json escape=json '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
                              '"method":"$request_method","uri":"$request_uri","status":$status,'
                              '"request_time":$request_time,"upstream":"$upstream_addr",'
                              '"upstream_time":"$upstream_response_time","request_id":"$request_id"}';
  access_log /dev/stdout json;
  error_log  /dev/stderr warn;

  # DNS interno do Docker: reavalia os IPs (suporta "docker compose up --scale")
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Rate limiting por IP de origem
  limit_req_zone $binary_remote_addr zone=api:10m    rate=50r/s;
  limit_req_zone $binary_remote_addr zone=export:10m rate=6r/m;
  limit_req_status 429;

  upstream contratos {
    zone contratos 64k;
    server contratos:3000 resolve;
    keepalive 16;
  }

  upstream flash_sales {
    zone flash_sales 64k;
    server flash-sales:3000 resolve;
    keepalive 32;
  }

  # Pool isolado para o relatório pesado (bulkhead)
  upstream flash_sales_export {
    zone flash_sales_export 64k;
    server flash-sales-export:3000 resolve;
    keepalive 4;
  }

  server {
    listen 8080;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Request-Id $request_id always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;

    # Métricas são internas (coletadas pelo Prometheus pela rede de monitoramento)
    location ~ ^/[^/]+/(metrics|ready)$ {
      return 404;
    }

    location = /health {
      default_type application/json;
      return 200 '{"status":"ok","component":"gateway"}';
    }

    location /contratos/ {
      limit_req zone=api burst=100 nodelay;
      proxy_pass http://contratos/;
    }

    location = /flash-sales/tickets/export {
      limit_req zone=export burst=2 nodelay;
      proxy_read_timeout 120s;
      proxy_pass http://flash_sales_export/tickets/export;
    }

    location /flash-sales/ {
      limit_req zone=api burst=200 nodelay;
      proxy_pass http://flash_sales/;
    }

    location / {
      return 404;
    }
  }
}
