# Atualizações automáticas e semanais de dependências (PRs validados pela pipeline)
version: 2
updates:
  - package-ecosystem: npm
    directories: ["/Contratos", "/Flash Sales"]
    schedule:
      interval: weekly
    groups:
      production:
        dependency-type: production
      development:
        dependency-type: development

  - package-ecosystem: docker
    directories: ["/Contratos", "/Flash Sales"]
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: "/infra/terraform"
    schedule:
      interval: weekly
