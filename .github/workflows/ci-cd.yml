# Pipeline de Integração e Entrega Contínua
#
#   test ──────┐
#              ├─► build-images (scan Trivy, push GHCR) ─┐
#   lint-infra ┤                                          ├─► deploy-production (main)
#              └─► e2e (Terraform + kind + smoke/carga) ──┘
#
# Actions fixadas por SHA de commit (proteção contra tags adulteradas na cadeia de suprimentos).

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  REGISTRY: ghcr.io

jobs:
  # ---------------------------------------------------------------- CI: código
  test:
    name: Testes (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: contratos
            path: Contratos
          - service: flash-sales
            path: Flash Sales
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.path }}/package-lock.json

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Verificar tipos (TypeScript)
        run: npm run typecheck

      - name: Testes unitários com cobertura
        run: npm run test:ci

      - name: Build de produção
        run: npm run build

      - name: Auditoria de dependências (produção)
        run: npm audit --omit=dev --audit-level=critical

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.service }}
          path: ${{ matrix.path }}/coverage
          retention-days: 7

  # ------------------------------------------------------- CI: infraestrutura
  lint-infra:
    name: Validação da infraestrutura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      # Mesmo alvo usado localmente: Hadolint, ShellCheck, Compose, kubeconform e Terraform
      - name: Lint da infraestrutura (make lint)
        run: make lint

      - name: Validar overlay de produção
        run: |
          # Os segredos reais são gerados no deploy; aqui renderizamos com os exemplos
          for f in infra/k8s/overlays/prod/secrets/*.env.example; do cp "$f" "${f%.example}"; done
          kubectl kustomize infra/k8s/overlays/prod | docker run --rm -i ghcr.io/yannh/kubeconform:v0.7.0 \
            -strict -summary -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'

  # ------------------------------------------------- CD: imagens de container
  build-images:
    name: Imagem (${{ matrix.service }})
    needs: [test, lint-infra]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: contratos
            path: Contratos
          - service: flash-sales
            path: Flash Sales
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Nome da imagem (minúsculo, exigência do GHCR)
        id: image
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=${REGISTRY}/${owner}/devops-api-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Metadados (tags e labels OCI)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,format=long,prefix=
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (carregado localmente para o scan)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.path }}
          load: true
          tags: ${{ steps.image.outputs.name }}:scan
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan de vulnerabilidades (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.name }}:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Login no GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push (com SBOM e proveniência)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.path }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.service }}

  # ------------------------------------- Testes fim a fim em cluster efêmero
  e2e:
    name: E2E em Kubernetes efêmero (kind)
    needs: [test, lint-infra]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KUBECONFIG: ${{ github.workspace }}/infra/terraform/kubeconfig
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build das imagens
        run: |
          docker buildx build --load -t devops-api/contratos:local \
            --cache-from type=gha,scope=contratos Contratos
          docker buildx build --load -t devops-api/flash-sales:local \
            --cache-from type=gha,scope=flash-sales "Flash Sales"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Provisionar cluster (Terraform — mesmo código do ambiente local)
        working-directory: infra/terraform
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false

      - name: Instalar kind CLI (carregar imagens locais no cluster)
        run: |
          # Diretório próprio: /usr/local/bin do runner pertence ao root
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSLo "$RUNNER_TEMP/bin/kind" https://kind.sigs.k8s.io/dl/v0.31.0/kind-linux-amd64
          chmod +x "$RUNNER_TEMP/bin/kind"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/kind" load docker-image devops-api/contratos:local devops-api/flash-sales:local --name devops-api

      - name: Deploy (Kustomize overlay dev)
        run: make k8s-deploy

      - name: Smoke test via ingress
        run: |
          scripts/seed-tickets.sh k8s smoke-test 10 --force
          scripts/smoke-test.sh http://localhost:8081

      - name: Teste de concorrência (sem overselling)
        run: |
          scripts/seed-tickets.sh k8s ci-load 100 --force
          docker run --rm --network host -v "$PWD/tests/load:/scripts:ro" \
            -e CHECKOUT_URL=http://localhost:8081/flash-sales/checkout \
            -e EVENT_ID=ci-load -e PEAK_RPS=40 \
            grafana/k6:1.3.0 run --quiet /scripts/flash-sale-spike.js
          scripts/check-oversell.sh k8s ci-load 100

      - name: Diagnóstico em caso de falha
        if: failure()
        run: |
          kubectl get all -A
          kubectl -n devops-api describe pods
          kubectl -n devops-api logs --all-containers --prefix -l app.kubernetes.io/part-of=devops-api --tail=100
          kubectl -n devops-api get events --sort-by=.lastTimestamp

      - name: Destruir cluster
        if: always()
        working-directory: infra/terraform
        run: terraform destroy -auto-approve -input=false

  # ---------------------------------------------------------- CD: produção
  deploy-production:
    name: Deploy em produção
    needs: [build-images, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PROD_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production # aprovação manual configurável em Settings > Environments
      url: ${{ vars.PROD_BASE_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0

      - name: Configurar acesso ao cluster
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Gerar segredos a partir dos GitHub Secrets
        working-directory: infra/k8s/overlays/prod/secrets
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          CONTRATOS_DB_PASSWORD: ${{ secrets.CONTRATOS_DB_PASSWORD }}
          FLASH_SALES_DB_PASSWORD: ${{ secrets.FLASH_SALES_DB_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
        run: |
          umask 077
          printf 'POSTGRES_PASSWORD=%s\nCONTRATOS_DB_PASSWORD=%s\nFLASH_SALES_DB_PASSWORD=%s\n' \
            "$POSTGRES_PASSWORD" "$CONTRATOS_DB_PASSWORD" "$FLASH_SALES_DB_PASSWORD" > postgres.env
          printf 'REDIS_PASSWORD=%s\n' "$REDIS_PASSWORD" > redis.env

      - name: Fixar imagens no SHA do commit (imutável e rastreável)
        working-directory: infra/k8s/overlays/prod
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          for svc in contratos flash-sales; do
            yq -i "(.images[] | select(.name == \"${svc}\")) |= (.newName = \"${REGISTRY}/${owner}/devops-api-${svc}\" | .newTag = \"${GITHUB_SHA}\")" kustomization.yaml
          done
          yq '.images' kustomization.yaml

      - name: Aplicar manifestos
        run: kubectl apply -k infra/k8s/overlays/prod

      - name: Aguardar rollout
        id: rollout
        run: |
          for d in contratos flash-sales flash-sales-export; do
            kubectl -n devops-api rollout status deployment/$d --timeout=300s
          done

      - name: Smoke test em produção
        id: smoke
        env:
          EVENT_ID: ${{ vars.PROD_SMOKE_EVENT_ID || 'smoke-test' }}
        run: scripts/smoke-test.sh "${{ vars.PROD_BASE_URL }}"

      - name: Rollback automático
        if: failure() && (steps.rollout.outcome == 'failure' || steps.smoke.outcome == 'failure')
        run: |
          for d in contratos flash-sales flash-sales-export; do
            kubectl -n devops-api rollout undo deployment/$d
          done
